context:
  version: "1.35.1"

package:
  name: fnox
  version: ${{ version }}

source:
  url: https://github.com/jdx/fnox/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fcb87bc1b1b6bd7b1ce54d9c37f2278e39cc36abf3c2fa98fd5fd0b2081ab122

build:
  number: 1
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: ${{ "fat" if build_platform == host_platform else "thin" }} # avoid linker crashes with `fat` LTO when cross-compiling (e.g. with Apple's `ld64`) 
      CARGO_PROFILE_RELEASE_STRIP: symbols
      OPENSSL_NO_VENDOR: "1" # force linking to host's (conda-forge's) OpenSSL libs (for Linux)
      PKG_CONFIG_ALLOW_CROSS: "1" # ignore `pkg-config` crate's host-target mismatch safeguard to fix cross compilation
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # set LIBCLANG_PATH for bindgen to find libclang (used by aws-lc-rs)
      # cf. https://github.com/conda-forge/clangdev-feedstock/issues/373 & https://github.com/rust-lang/rust-bindgen/issues/918
      - if: unix
        then: $env.LIBCLANG_PATH = $env.BUILD_PREFIX | path join lib
      - if: win
        then:
          - $env.LIBCLANG_PATH = $env.BUILD_PREFIX | path join Library lib
          # bindgen expects libclang.dll but conda-forge only provides versioned DLLs on Windows, so create a copy
          - let bin_dir = ($env.BUILD_PREFIX)/Library/bin | str replace --all '\' '/'
          - let source_dll = glob ($bin_dir)/libclang-*.dll | first
          - cp $source_dll ($bin_dir)/libclang.dll
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/fnox
          - ^$bin completion bash | save ($prefix)/share/bash-completion/completions/fnox
          - ^$bin completion fish | save ($prefix)/share/fish/vendor_completions.d/fnox.fish
          - ^$bin completion zsh  | save ($prefix)/share/zsh/site-functions/_fnox

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - clang
    - cmake
    - libclang
    - make
    - ninja
    - nushell
    - perl
    - pkg-config
  host:
    - if: linux
      then:
        - libudev
        - openssl

tests:
  - script:
      - fnox --help
      - fnox --version
  - package_contents:
      bin:
        - fnox
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/fnox
            - share/fish/vendor_completions.d/fnox.fish
            - share/zsh/site-functions/_fnox
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/fnox
            - Library/share/fish/vendor_completions.d/fnox.fish
            - Library/share/zsh/site-functions/_fnox
      strict: true

about:
  summary: Fort Knox for your secrets — flexible secret management with encryption and cloud providers
  description: |
    fnox is a flexible secret management tool that supports storing secrets with
    encryption (age, AWS KMS, Azure KMS, GCP KMS) or remotely in cloud providers
    (AWS Secrets Manager, AWS Parameter Store, Azure Key Vault, GCP Secret Manager,
    1Password, Bitwarden, HashiCorp Vault, and more). It provides a unified
    interface to work with secrets across development, CI, and production,
    and supports shell integration to auto-load secrets on directory change.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://fnox.jdx.dev
  repository: https://github.com/jdx/fnox

extra:
  recipe-maintainers:
    - salim-b
